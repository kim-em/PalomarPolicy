name: Validate policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Validate JSON and prompt references
        run: |
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".")
          rubric = json.loads((root / "rubric.json").read_text())
          review_schema = json.loads((root / "schemas/review.schema.json").read_text())
          ids = [step["id"] for step in rubric["steps"]]
          assert len(ids) == len(set(ids)), "duplicate rubric step"
          assert ids[-1] == "synthesis", "synthesis must be last"
          assert rubric["schema_version"] == 10
          assert rubric["step_result"]["outcomes"] == ["neutral", "warning", "failure"]
          assert rubric["step_result"]["required_fields"] == [
              "step",
              "outcome",
              "summary",
              "findings",
              "scores",
              "trust_level",
              "sources_checked",
              "declarations_checked",
              "codes_checked",
              "internal_notes",
          ]
          assert review_schema["properties"]["schema_version"]["const"] == 3
          assert review_schema["properties"]["outcome"]["enum"] == [
              "neutral",
              "revision_required",
              "rejected",
          ]
          assert review_schema["properties"]["checks"]["items"]["properties"]["outcome"]["enum"] == [
              "neutral",
              "warning",
              "failure",
          ]

          # What is served has to be an allowlist all the way down. Closed at
          # the root and open one level below is a denylist below, and a
          # denylist misses whatever nobody named: the reviewer strips `scores`
          # and `severity` by name, so a review contract that grew a
          # `confidence` or a `raw_score` inside a check would have been served
          # with nothing failing. This is the repository where that field would
          # be decided on, which is why the assertion is here.
          public_schema = json.loads((root / "schemas/public-review.schema.json").read_text())
          public_check = public_schema["properties"]["checks"]["items"]
          public_finding = public_check["properties"]["findings"]["items"]
          for name, subschema in (("check", public_check), ("finding", public_finding)):
              assert subschema["additionalProperties"] is False, f"{name} is open in what is served"
          # Exactly, in both directions. The served review is the delivered one
          # without the scores and without the repetition of every finding
          # message, and nothing else may differ either way.
          assert set(public_schema["properties"]) == set(review_schema["properties"]) - {
              "scores",
              "warnings",
          }, "the served review and the delivered one differ by more than the redaction"
          # Named here because `review.schema.json` does not enumerate them: it
          # says a check has an outcome and stops, and the reviewer's own step
          # contract is what actually decides the shape, in a third repository.
          # A field added there reaches this list through a person, so this list
          # is where somebody has to think about whether it may be read.
          assert set(public_check["properties"]) == {
              "step",
              "outcome",
              "summary",
              "findings",
              "trust_level",
              "sources_checked",
              "declarations_checked",
              "codes_checked",
          }, "a served check carries a field nobody has decided may be served"
          assert set(public_finding["properties"]) == {
              "evidence",
              "message",
          }, "a served finding carries a field nobody has decided may be served"

          minimum = rubric["minimum_score"]
          assert isinstance(minimum, int) and not isinstance(minimum, bool) and 1 <= minimum <= 5
          registry_scores = rubric["registry_scores"]
          assert len(registry_scores) == len(set(registry_scores))
          expected_registry_scores = {
              "statement_alignment",
              "definition_fidelity",
              "notability",
              "literature",
              "clarity",
          }
          assert set(registry_scores) == expected_registry_scores
          allowed_scores = expected_registry_scores | {
              "provenance",
              "auditability",
              "proof_alignment",
              "classification",
          }
          allowed_inputs = {
              "all_previous_results",
              "previous_findings",
              "challenge_source",
              "comparator_config",
              "formalization_metadata",
              "submission",
              "lakefile",
              "lean_toolchain",
              "mechanical_report",
              "project_readme",
              "solution_source",
          }
          mandatory_reject = rubric.get("mandatory_reject_below_minimum", [])
          assert len(mandatory_reject) == len(set(mandatory_reject))
          assert set(mandatory_reject) <= set(registry_scores)
          # The reviewer parses the whole stripped engine output as one JSON
          # object and deliberately recovers neither a Markdown fence nor
          # surrounding prose. A prompt that shows its result inside a fence
          # asks for output the parser rejects, so the contract is asserted on
          # the prompt set `rubric.json` actually names; a second hand-copied
          # list of prompt filenames would drift away from the rubric.
          bare_json_contract = (
              "Return one bare JSON object and nothing else: "
              "no code fence, no surrounding prose."
          )
          owned_scores = []
          owners = {}
          for step in rubric["steps"]:
              path = root / step["prompt"]
              assert path.is_file(), f"missing prompt: {path}"
              prompt_text = path.read_text()
              assert prompt_text.strip(), f"empty prompt: {path}"
              for marker in ("```", "~~~"):
                  assert marker not in prompt_text, f"prompt carries a code fence: {path}"
              # Read through the line wrapping: the sentence is one contract,
              # and where a paragraph breaks it is not part of it.
              assert bare_json_contract in " ".join(prompt_text.split()), (
                  f"prompt does not require one bare JSON object: {path}"
              )
              if step["id"] != "synthesis":
                  # The example has to survive fence removal as the thing it
                  # asks for: one JSON object. Parsing it says that, where
                  # searching for its text would still pass on an example that
                  # had lost a brace. What it must contain then comes from the
                  # rubric rather than from a copy of the example: the step
                  # this check reports as, every field a step result requires,
                  # the outcome vocabulary, and exactly the scores this step
                  # owns.
                  assert "\n{\n" in prompt_text, f"prompt lost its result example: {path}"
                  try:
                      example, _ = json.JSONDecoder().raw_decode(
                          prompt_text[prompt_text.index("\n{\n") + 1:]
                      )
                  except json.JSONDecodeError as error:
                      raise AssertionError(
                          f"result example is not one JSON object: {path}: {error}"
                      ) from None
                  assert example["step"] == step["id"], f"wrong step in example: {path}"
                  assert set(rubric["step_result"]["required_fields"]) <= set(example), (
                      f"result example omits a required field: {path}"
                  )
                  assert example["outcome"] == "|".join(rubric["step_result"]["outcomes"]), (
                      f"result example omits the outcome vocabulary: {path}"
                  )
                  assert set(example["scores"]) == set(step["score_keys"]), (
                      f"result example does not show the scores this step owns: {path}"
                  )
                  score_keys = step["score_keys"]
                  assert score_keys and len(score_keys) == len(set(score_keys))
                  assert set(score_keys) <= allowed_scores
                  assert "policy:CONTRIBUTING.md" in step["inputs"]
                  assert "policy:rubric.json" in step["inputs"]
                  assert "policy:prompts/materiality.md" in step["inputs"]
                  owned_scores.extend(score_keys)
                  owners.update({key: step for key in score_keys})
              for input_name in step.get("inputs", []):
                  if input_name.startswith("policy:"):
                      policy_path = root / input_name.removeprefix("policy:")
                      assert policy_path.is_file(), f"missing policy input: {policy_path}"
                  else:
                      assert input_name in allowed_inputs, f"unknown rubric input: {input_name}"
          assert len(owned_scores) == len(set(owned_scores)), "duplicate score owner"
          assert set(registry_scores) <= set(owned_scores)
          assert all(owners[key]["required"] for key in registry_scores)
          coverage_steps = {
              step["id"] for step in rubric["steps"]
              if step.get("requires_declaration_coverage") is True
          }
          assert coverage_steps == {
              "statement_alignment",
              "definition_fidelity",
              "literature_notability",
              "proof_account",
          }
          # Synthesis returns the keys the runner wraps into the review report,
          # and the fence removal above rewrote the paragraph that names them.
          synthesis_text = " ".join((root / rubric["steps"][-1]["prompt"]).read_text().split())
          assert (
              "The object has exactly `outcome`, `summary`, `scores`, "
              "`warnings`, and `requested_changes`;" in synthesis_text
          ), "synthesis no longer states its exact output keys"

          # A dated scouting list with no owner and no refresh process reads as
          # maintained policy while it sits here. Git keeps the history; if a
          # maintained corpus is wanted it belongs in a repository that has
          # somebody to keep it current, so it does not quietly return.
          snapshot = "research/candidate-submissions.md"
          assert not (root / snapshot).exists(), f"{snapshot} is back in current policy"
          # Every readable file rather than the extensions policy happens to
          # use today, so a document in a format nobody has added yet is
          # covered. `.github` is exempt because this check names the path.
          for doc in sorted(root.rglob("*")):
              if not doc.is_file() or {".git", ".github"} & set(doc.parts):
                  continue
              try:
                  text = doc.read_text()
              except UnicodeDecodeError:
                  continue
              assert "candidate-submissions" not in text, (
                  f"{doc} links to the removed candidate snapshot"
              )

          classification_coverage_steps = {
              step["id"] for step in rubric["steps"]
              if step.get("requires_classification_coverage") is True
          }
          assert classification_coverage_steps == {"classification"}
          description_coverage_steps = {
              step["id"] for step in rubric["steps"]
              if step.get("requires_description_coverage") is True
          }
          assert description_coverage_steps == set()

          metadata_prompt = " ".join(
              (root / "prompts" / "01-metadata.md").read_text().split()
          )
          for required_text in (
              "`project.authors`",
              "`project.responsible_maintainers`",
              "AI model, automated agent, system, session, or tool",
              "use a `failure` outcome",
              "retaining accurate AI credit in `automation.methods`",
          ):
              assert required_text in metadata_prompt, (
                  f"metadata prompt lost the human-identity rule: {required_text}"
              )

          cases = json.loads((root / "tests" / "materiality-cases.json").read_text())
          assert len(cases) >= 8
          assert len({case["id"] for case in cases}) == len(cases)
          cases_by_id = {case["id"]: case for case in cases}
          for case_id, expected in {
              "possible-proof-level-classification": "internal_note",
              "egregiously-off-topic-classification": "finding",
              "project-wide-multi-config-scope": "internal_note",
              "concise-grouped-registry-abstract": "internal_note",
              "legacy-missing-mechanical-abstract": "internal_note",
              "misleading-registry-abstract": "finding",
              "unconditional-with-domain-conditions": "internal_note",
              "distinct-contribution-roles": "internal_note",
              "ai-named-as-project-author": "finding",
              "ai-named-as-responsible-maintainer": "finding",
              "ai-contribution-disclosed-outside-identity-fields": "internal_note",
              "same-role-attribution-conflict": "finding",
              "cited-source-literature-context": "internal_note",
              "reviewer-cannot-access-cited-source": "internal_note",
          }.items():
              assert cases_by_id[case_id]["expected"] == expected
          assert {case["expected"] for case in cases} >= {
              "internal_note",
              "finding",
              "finding_once",
              "reject",
          }
          assert len({case["area"] for case in cases}) >= 6
          assert all(case["scenario"].strip() and case["reason"].strip() for case in cases)
          print(f"validated {len(ids)} review steps")
          PY
